name: Verify shared motion system
on:
  push:
    branches: [verify/shared-motion-20261112]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed source migration on the verification branch only
        run: |
          python3 .github/qa/apply-motion-refactor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'Apply shared motion source migration [skip ci]'
            git push origin HEAD:verify/shared-motion-20261112
          fi
      - name: Install, lint and build
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
      - name: Prepare unchanged baseline
        run: |
          git fetch --no-tags --depth 1 origin d9736f65cee89e41dcfce4041711cd24194fc418
          git worktree add --detach "$RUNNER_TEMP/motion-baseline" d9736f65cee89e41dcfce4041711cd24194fc418
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/motion-baseline/node_modules"
          (cd "$RUNNER_TEMP/motion-baseline" && npm run build)
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/motion-browser" playwright@1.56.1 pngjs@7.0.0 --no-audit --no-fund
          "$RUNNER_TEMP/motion-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Check all six pages and timing equivalence
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/motion-browser/node_modules/playwright/index.mjs
          PNG_MODULE: ${{ runner.temp }}/motion-browser/node_modules/pngjs/lib/png.js
          QA_OUTPUT: ${{ runner.temp }}/motion-system-qa
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/motion-preview.log" 2>&1 &
          (cd "$RUNNER_TEMP/motion-baseline" && npm run preview -- --host 127.0.0.1 --port 4174) > "$RUNNER_TEMP/motion-baseline.log" 2>&1 &
          npm run dev -- --host 127.0.0.1 --port 4193 > "$RUNNER_TEMP/motion-dev.log" 2>&1 &
          for port in 4173 4174 4193; do
            for attempt in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:$port/" > /dev/null; then break; fi
              sleep 1
            done
          done
          cp .github/qa/motion-check.txt "$RUNNER_TEMP/motion-check.mjs"
          node "$RUNNER_TEMP/motion-check.mjs"
      - name: Record exact tested source tree
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/motion-system-qa"
          git rev-parse HEAD > "$RUNNER_TEMP/motion-system-qa/commit.txt"
          git rev-parse HEAD:src > "$RUNNER_TEMP/motion-system-qa/src-tree.txt"
          git diff --stat d9736f65cee89e41dcfce4041711cd24194fc418 HEAD -- src > "$RUNNER_TEMP/motion-system-qa/changes.txt"
          tar -czf "$RUNNER_TEMP/motion-system-qa/source-and-build.tar.gz" src dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-motion-verification
          path: ${{ runner.temp }}/motion-system-qa
          retention-days: 7
