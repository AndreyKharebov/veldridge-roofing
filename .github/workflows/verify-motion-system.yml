name: Verify shared motion system
on:
  push:
    branches: [verify/shared-motion-20261112]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run build
      - name: Prepare baseline for the animation refactor
        run: |
          mkdir -p "$RUNNER_TEMP/motion-baseline"
          cp -r src public dist package.json package-lock.json index.html eslint.config.js vite.config.js "$RUNNER_TEMP/motion-baseline/"
          git rev-parse HEAD > "$RUNNER_TEMP/motion-baseline/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: motion-baseline
          path: ${{ runner.temp }}/motion-baseline
          retention-days: 7
