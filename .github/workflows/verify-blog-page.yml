name: Verify Blog page
on:
  push:
    branches: ['verify/blog-page-20261112']
permissions:
  contents: read
jobs:
  blog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint the entire application
        run: npm run lint
      - name: Build the entire application
        run: npm run build
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/blog-browser" playwright@1.56.1 --no-audit --no-fund
          "$RUNNER_TEMP/blog-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify Blog layouts, all articles and modal behavior
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/blog-browser/node_modules/playwright/index.mjs
          QA_OUTPUT: ${{ runner.temp }}/blog-qa
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/blog-preview.log" 2>&1 &
          npm run dev -- --host 127.0.0.1 --port 4193 > "$RUNNER_TEMP/blog-dev.log" 2>&1 &
          for n in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/blog >/dev/null && curl -fsS http://127.0.0.1:4193/blog >/dev/null && break; sleep 1; done
          cp .github/qa/blog-check.txt "$RUNNER_TEMP/blog-browser/check.mjs"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'blog-browser/check.mjs'
          s = p.read_text()
          # A stretched title button intentionally receives clicks over its image.
          old = "await page.locator('.article-row__image').first().click();"
          new = "await page.locator('.article-row__image').first().scrollIntoViewIfNeeded(); const imageBounds = await page.locator('.article-row__image').first().boundingBox(); await page.mouse.click(imageBounds.x + imageBounds.width / 2, imageBounds.y + imageBounds.height / 2);"
          assert old in s
          s = s.replace(old, new)
          # Exercise real scrolling and await decoding before a full-page capture.
          # A downloaded offscreen image is not necessarily painted yet.
          old = "await page.screenshot({ path: path.join(out, `${name}-blog-${width}.png`), fullPage: true });"
          new = "for (const image of await page.locator('.blog-page img').all()) { await image.scrollIntoViewIfNeeded(); await image.evaluate((img) => img.decode()); } await page.evaluate(() => window.scrollTo({ top: 0, left: 0, behavior: 'instant' })); await page.waitForTimeout(150); " + old
          assert old in s
          p.write_text(s.replace(old, new))
          PY
          node "$RUNNER_TEMP/blog-browser/check.mjs"
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-page-verification
          path: |
            ${{ runner.temp }}/blog-qa
            ${{ runner.temp }}/blog-preview.log
            ${{ runner.temp }}/blog-dev.log
          retention-days: 7
