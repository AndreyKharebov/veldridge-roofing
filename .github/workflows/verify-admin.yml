name: Verify admin workspace
on:
  push:
    branches: [verify/admin-workspace-20261113]
    paths: ['.verify/**', '.github/workflows/verify-admin.yml', 'src/**', 'package*.json']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact saved dependencies
        run: npm ci
      - name: Lint and production build
        run: npm run lint && npm run build
      - name: Save reproducible source snapshot
        run: |
          git archive --format=tar HEAD > /tmp/admin-source.tar
          tar -rf /tmp/admin-source.tar node_modules dist
          gzip /tmp/admin-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: admin-source-snapshot
          path: /tmp/admin-source.tar.gz
          retention-days: 2
      - name: Install isolated browser verification
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Verify editors, public integration, persistence and responsiveness
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/admin-vite.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          python .verify/admin-qa.py
      - name: Record tested tree
        if: always()
        run: |
          mkdir -p admin-qa
          git rev-parse HEAD > admin-qa/tested-commit.txt
          git rev-parse HEAD:src > admin-qa/tested-src-tree.txt
          git rev-parse HEAD:package.json > admin-qa/package-blob.txt
          git rev-parse HEAD:package-lock.json > admin-qa/lock-blob.txt
          cp /tmp/admin-vite.log admin-qa/vite.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-workspace-verification
          path: |
            admin-qa/*.json
            admin-qa/*.png
            admin-qa/*.txt
            admin-qa/*.log
          retention-days: 7
