name: Verify admin workspace
on:
  push:
    branches: [verify/admin-workspace-20261113]
    paths: ['.verify/**', '.github/workflows/verify-admin.yml', 'src/**', 'package*.json']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tested_sha: ${{ steps.record.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed compatibility and feedback fixes
        run: |
          python .verify/apply-recovery.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .verify/admin-qa.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix WebKit image persistence and truthful save feedback [skip ci]'
            git push origin HEAD:verify/admin-workspace-20261113
          fi
      - name: Lint and production build
        run: npm ci && npm run lint && npm run build
      - name: Record exact source to verify
        id: record
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    name: Browser verification (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [development, production]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tested_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies and build
        run: npm ci && npm run build
      - name: Install isolated browser verification
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Start development and production servers
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/admin-dev.log 2>&1 &
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/admin-prod.log 2>&1 &
          for port in 5173 4173; do
            for i in $(seq 1 40); do curl -fsS http://127.0.0.1:$port/ >/dev/null && break || sleep 1; done
          done
      - name: Verify complete workspace workflows in Chromium and WebKit
        env:
          BASE_URL: ${{ matrix.mode == 'production' && 'http://127.0.0.1:4173' || 'http://127.0.0.1:5173' }}
        run: python .verify/admin-qa.py
      - name: Verify development-to-production asset references
        if: matrix.mode == 'production'
        run: python .verify/stable-assets.py
      - name: Record tested tree
        if: always()
        run: |
          mkdir -p admin-qa
          git rev-parse HEAD > admin-qa/tested-commit.txt
          git rev-parse HEAD:src > admin-qa/tested-src-tree.txt
          git rev-parse HEAD:package.json > admin-qa/package-blob.txt
          git rev-parse HEAD:package-lock.json > admin-qa/lock-blob.txt
          cp /tmp/admin-dev.log /tmp/admin-prod.log admin-qa/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-${{ matrix.mode }}-verification
          path: admin-qa/
          retention-days: 7
