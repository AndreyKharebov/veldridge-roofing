name: Verify Gallery motion
on:
  push:
    branches: [verify/gallery-motion-20261112]
permissions:
  contents: read
jobs:
  gallery-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install, lint and build the application
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
      - name: Install isolated browser verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/gallery-browser" playwright@1.56.1 pngjs@7.0.0 --no-audit --no-fund
          "$RUNNER_TEMP/gallery-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Prepare unchanged Gallery baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/gallery-baseline" 2201fcae08e9bf5ca0755865306fe499862ed4ca
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/gallery-baseline/node_modules"
          (cd "$RUNNER_TEMP/gallery-baseline" && npm run build)
      - name: Verify responsive motion, filters, loading and dialogs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/gallery-browser/node_modules/playwright/index.mjs
          PNG_MODULE: ${{ runner.temp }}/gallery-browser/node_modules/pngjs/lib/png.js
          QA_OUTPUT: ${{ runner.temp }}/gallery-motion-qa
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/gallery-preview.log" 2>&1 &
          (cd "$RUNNER_TEMP/gallery-baseline" && npm run preview -- --host 127.0.0.1 --port 4174) > "$RUNNER_TEMP/gallery-baseline.log" 2>&1 &
          npm run dev -- --host 127.0.0.1 --port 4193 > "$RUNNER_TEMP/gallery-dev.log" 2>&1 &
          for port in 4173 4174 4193; do
            for attempt in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:$port/gallery" > /dev/null; then break; fi
              sleep 1
            done
          done
          cp .github/qa/gallery-motion-check.txt "$RUNNER_TEMP/gallery-motion-check.mjs"
          node "$RUNNER_TEMP/gallery-motion-check.mjs"
      - name: Upload verification report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-motion-verification
          path: |
            ${{ runner.temp }}/gallery-motion-qa
            ${{ runner.temp }}/gallery-preview.log
            ${{ runner.temp }}/gallery-dev.log
          retention-days: 7
